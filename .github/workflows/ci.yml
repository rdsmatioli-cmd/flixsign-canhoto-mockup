name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'
      # Textos regulatórios do mockup (MOC da NF-e, LGPD, promessas): .github/testes/textos.test.mjs
      - name: Testes dos textos
        run: node --test .github/testes/*.test.mjs
